services:
  - type: web
    runtime: node
    name: tristar-motors
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRISTAR_SITE_URL
        value: https://tristarmotors.co.ke
      - key: TRISTAR_ADMIN_PASSWORD
        generateValue: true
