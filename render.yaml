services:
  - type: web
    runtime: node
    name: tristar-motors
    plan: starter
    buildCommand: npm ci --prefix dealer-platform && npm run build
    startCommand: npm --prefix dealer-platform start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRISTAR_DATA_DIR
        value: /var/data
      - key: TRISTAR_ADMIN_PASSWORD
        generateValue: true
    disk:
      name: tristar-data
      mountPath: /var/data
      sizeGB: 1
